spring.application.name=health-dashboard
server.port=${PORT:8081}

app.version=${APP_VERSION:1.0.0}
app.environment=${APP_ENV:unknown}

app.kafka.enabled=${KAFKA_ENABLED:false}
app.kafka.topic=${KAFKA_TOPIC:system-health-events}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=health-dashboard
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.listener.auto-startup=${KAFKA_ENABLED:false}
app.kafka.metrics-topic=${KAFKA_METRICS_TOPIC:system-metrics}
app.alerts.threshold-percent=${ALERT_THRESHOLD_PERCENT:80}